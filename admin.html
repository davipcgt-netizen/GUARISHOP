<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuariShop Studio | Panel de Administración</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SDK Oficial de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        blackBg: '#050505', 
                        blackCard: '#0f1115',
                        neon: '#39ff14', 
                        neonHover: '#32e612',
                        whiteText: '#f8f8f8', 
                        grayText: '#a0a0a0'
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Poppins', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { background-color: #050505; color: #f8f8f8; overflow-x: hidden; position: relative; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #111111; border-radius: 4px; border: 1px solid #39ff14; }
        
        .neon-text { color: #39ff14; text-shadow: 0 0 12px rgba(57, 255, 20, 0.7); }
        .neon-bg-glow { box-shadow: 0 0 25px rgba(57, 255, 20, 0.35); }
        .disabled-btn { opacity: 0.5; cursor: not-allowed; pointer-events: none; }

        /* Partículas flotantes de fondo optimizadas por GPU */
        @keyframes ambient-float {
            0% { transform: translate3d(0, 0, 0) rotate(0deg); opacity: 0.1; }
            50% { transform: translate3d(var(--dx), var(--dy), 0) rotate(180deg); opacity: 0.3; }
            100% { transform: translate3d(0, 0, 0) rotate(360deg); opacity: 0.1; }
        }
        .bg-particle {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            color: #39ff14;
            animation: ambient-float var(--duration) ease-in-out infinite;
            will-change: transform, opacity;
        }

        /* Orbes de luz ambiental */
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.1; filter: blur(50px); }
            50% { opacity: 0.25; filter: blur(70px); }
        }
        .ambient-orb {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: rgba(57, 255, 20, 0.12);
            pointer-events: none;
            z-index: 0;
            animation: pulse-glow 5s ease-in-out infinite;
        }

        .glass-header { background: rgba(15, 17, 21, 0.9); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    </style>
</head>
<body class="font-sans min-h-screen flex flex-col relative z-10">

    <!-- Partículas Ambientales -->
    <div id="ambient-particles">
        <i class="fa-solid fa-bolt bg-particle text-xs" style="top: 15%; left: 10%; --duration: 7s; --dx: 40px; --dy: -50px;"></i>
        <i class="fa-solid fa-cloud-arrow-up bg-particle text-sm" style="top: 35%; left: 88%; --duration: 9s; --dx: -45px; --dy: 60px;"></i>
        <i class="fa-solid fa-boxes-stacked bg-particle text-xs" style="top: 75%; left: 8%; --duration: 8s; --dx: 50px; --dy: -40px;"></i>
        <i class="fa-solid fa-shield-halved bg-particle text-sm" style="top: 85%; left: 85%; --duration: 6.5s; --dx: -35px; --dy: -30px;"></i>
    </div>

    <header class="glass-header border-b border-white/10 px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-4 sticky top-0 z-40 shadow-xl">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-blackBg border border-neon rounded-xl flex items-center justify-center neon-bg-glow">
                <i class="fa-solid fa-bolt text-neon text-lg animate-pulse"></i>
            </div>
            <h1 class="font-display font-bold text-xl uppercase tracking-wider text-whiteText">GuariShop <span class="text-neon">Studio</span></h1>
        </div>
        <div class="flex gap-3 items-center">
            <span id="conn-status" class="flex items-center gap-2 text-xs font-bold text-grayText border border-white/10 px-3.5 py-2 rounded-xl bg-blackBg shadow-inner">
                <i class="fa-solid fa-circle-notch animate-spin text-neon"></i> Conectando...
            </span>
            
            <button onclick="fetchProducts()" class="text-grayText hover:text-neon border border-white/10 hover:border-neon/50 transition-all font-bold px-3 py-2 rounded-xl text-xs flex items-center gap-2 bg-blackBg active:scale-95" title="Recargar lista">
                <i class="fa-solid fa-rotate"></i>
            </button>

            <a href="index.html" target="_blank" class="bg-neon/10 text-neon border border-neon/50 hover:bg-neon hover:text-blackBg transition-all font-bold px-4 py-2 rounded-xl text-xs uppercase flex items-center gap-2 neon-bg-glow active:scale-95">
                <i class="fa-solid fa-store"></i> Ver Tienda
            </a>
        </div>
    </header>

    <main class="max-w-6xl mx-auto w-full p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 items-start relative z-10 my-6">
        <div class="ambient-orb top-10 left-1/4"></div>
        
        <!-- Formulario de Subida -->
        <section class="lg:col-span-5 bg-blackCard border border-neon/30 rounded-3xl p-6 sm:p-8 shadow-2xl relative overflow-hidden">
            <div class="absolute -top-10 -right-10 w-36 h-36 bg-neon/15 rounded-full blur-[50px] pointer-events-none"></div>
            
            <h2 class="font-display text-xl font-bold uppercase mb-6 flex items-center gap-3 text-whiteText border-b border-white/10 pb-4">
                <div class="w-8 h-8 rounded-lg bg-neon/10 border border-neon/40 flex items-center justify-center text-neon">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                </div>
                Publicar Accesorio
            </h2>
            
            <form id="productForm" class="space-y-5 relative z-10">
                <!-- Zona Foto -->
                <div>
                    <label class="block text-[11px] font-bold text-grayText mb-1.5 uppercase tracking-wider">Foto del Producto (Obligatorio)</label>
                    <div class="relative border-2 border-dashed border-white/20 hover:border-neon bg-blackBg rounded-2xl p-5 text-center transition-all cursor-pointer group shadow-inner" onclick="document.getElementById('productImage').click()">
                        <input type="file" id="productImage" accept="image/*" class="hidden" onchange="previewImage(this)" required>
                        <div id="imagePlaceholder" class="flex flex-col items-center justify-center space-y-2.5 pointer-events-none py-4">
                            <div class="w-12 h-12 rounded-full bg-white/5 border border-white/10 flex items-center justify-center group-hover:border-neon group-hover:bg-neon/10 transition-all">
                                <i class="fa-solid fa-image text-xl text-white/40 group-hover:text-neon transition-colors"></i>
                            </div>
                            <span class="text-xs font-semibold text-grayText group-hover:text-whiteText transition-colors">Toca para subir imagen</span>
                        </div>
                        <img id="imagePreview" src="" class="hidden w-full h-40 object-cover rounded-xl border border-neon/40 shadow-md">
                    </div>
                </div>

                <!-- Datos -->
                <div>
                    <label class="block text-[11px] font-bold text-grayText mb-1.5 uppercase tracking-wider">Nombre del Producto</label>
                    <input type="text" id="productName" placeholder="Ej: Audífonos Gamer RGB" class="w-full bg-blackBg border border-white/10 rounded-xl px-4 py-3.5 text-sm text-whiteText outline-none focus:border-neon transition-all shadow-inner" required>
                </div>
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[11px] font-bold text-grayText mb-1.5 uppercase tracking-wider">Categoría</label>
                        <select id="productCategory" class="w-full bg-blackBg border border-white/10 rounded-xl px-4 py-3.5 text-sm text-whiteText outline-none focus:border-neon transition-all cursor-pointer appearance-none shadow-inner">
                            <option value="audifonos">Audífonos</option>
                            <option value="cargadores">Cargadores</option>
                            <option value="forros">Forros</option>
                            <option value="iluminacion">Iluminación</option>
                            <option value="multiples">Múltiples</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-grayText mb-1.5 uppercase tracking-wider">Precio ($)</label>
                        <input type="number" step="0.5" id="productPrice" placeholder="0.00" class="w-full bg-blackBg border border-white/10 rounded-xl px-4 py-3.5 text-sm text-whiteText outline-none focus:border-neon font-bold transition-all shadow-inner" required>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-neon text-blackBg font-display font-black py-4 rounded-xl uppercase tracking-wide hover:bg-neonHover transition-all neon-bg-glow active:scale-95 flex items-center justify-center gap-2 mt-4 shadow-lg shadow-neon/20">
                    <i class="fa-solid fa-cloud-arrow-up text-base"></i> Publicar Producto
                </button>
            </form>
        </section>

        <!-- Inventario en Supabase -->
        <section class="lg:col-span-7 bg-blackCard border border-white/10 rounded-3xl p-6 sm:p-8 shadow-2xl flex flex-col h-[540px] sm:h-[620px] relative overflow-hidden">
            <div class="absolute -bottom-10 -right-10 w-36 h-36 bg-neon/10 rounded-full blur-[50px] pointer-events-none"></div>
            
            <div class="flex justify-between items-center mb-6 pb-4 border-b border-white/10 relative z-10">
                <h2 class="font-display text-xl font-bold uppercase flex items-center gap-3 text-whiteText">
                    <div class="w-8 h-8 rounded-lg bg-neon/10 border border-neon/40 flex items-center justify-center text-neon">
                        <i class="fa-solid fa-boxes-stacked"></i>
                    </div>
                    Inventario en la Nube
                </h2>
                <span class="bg-blackBg border border-white/10 px-3.5 py-1.5 rounded-xl text-xs font-bold text-neon shadow-inner"><span id="countDisplay">0</span> publicadas</span>
            </div>
            
            <div id="inventoryList" class="flex-grow overflow-y-auto space-y-3.5 pr-1 relative z-10">
                <!-- Se inyecta via JS -->
            </div>
        </section>
    </main>

    <!-- Modal de Confirmación para Eliminar -->
    <div id="delete-modal" class="fixed inset-0 bg-black/80 z-50 hidden items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-blackCard border border-neon/40 rounded-3xl p-6 max-w-sm w-full text-center shadow-2xl">
            <div class="w-12 h-12 mx-auto bg-red-500/10 border border-red-500/40 rounded-full flex items-center justify-center mb-4 text-red-500">
                <i class="fa-solid fa-trash-can text-xl"></i>
            </div>
            <h3 class="font-display font-bold text-lg text-whiteText mb-1">¿Eliminar Producto?</h3>
            <p class="text-grayText text-xs mb-6">Esta acción borrará el producto del catálogo permanentemente.</p>
            <div class="flex gap-3">
                <button onclick="closeDeleteModal()" class="flex-1 py-2.5 rounded-xl bg-blackBg border border-white/10 text-grayText hover:text-whiteText text-xs font-bold uppercase transition-colors">Cancelar</button>
                <button id="confirm-delete-btn" class="flex-1 py-2.5 rounded-xl bg-red-500 hover:bg-red-600 text-white text-xs font-bold uppercase transition-colors shadow-lg">Sí, Eliminar</button>
            </div>
        </div>
    </div>

    <!-- Toast UI -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-blackCard border border-neon text-white px-5 py-3 rounded-2xl z-50 transform translate-y-20 opacity-0 transition-all duration-300 shadow-2xl flex items-center gap-3 pointer-events-none">
        <i id="toastIcon" class="fa-solid fa-bolt text-neon"></i><span id="toastMsg" class="text-xs font-bold"></span>
    </div>

    <script>
        // =========================================================
        // ⚡ CONEXIÓN DIRECTA A SUPABASE (GUARISHOP STUDIO)
        // =========================================================
        const SUPABASE_URL = "https://jouqjbutkvqqvqgmzlux.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpvdXFqYnV0a3ZxcXZxZ216bHV4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI2MDM0OTYsImV4cCI6MjEwODE3OTQ5Nn0.MH8aHBdnsR99EFTf92OzXVi3oKNBKpuqjq5SYSAzsFI";
        const BUCKET_NAME = "guarishop-fotos";
        const TABLE_NAME = "guarishop_productos";

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let selectedFile = null;
        let memoryProducts = [];
        let productToDeleteId = null;

        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            document.getElementById('toastIcon').className = `fa-solid ${isError ? 'fa-triangle-exclamation text-red-500' : 'fa-bolt text-neon'}`;
            t.className = `fixed bottom-6 left-1/2 -translate-x-1/2 bg-blackCard border ${isError ? 'border-red-500' : 'border-neon/60'} text-white px-5 py-3 rounded-2xl z-50 transform transition-all duration-300 shadow-2xl flex items-center gap-3 translate-y-0 opacity-100 pointer-events-none`;
            setTimeout(() => { t.classList.add('translate-y-20', 'opacity-0'); }, 4000);
        }

        function setStatus(msg, color, icon) {
            const el = document.getElementById('conn-status');
            el.innerHTML = `<i class="fa-solid ${icon} text-${color}"></i> ${msg}`;
        }

        function previewImage(input) {
            if (input.files && input.files[0]) {
                selectedFile = input.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('imagePlaceholder').classList.add('hidden');
                    const preview = document.getElementById('imagePreview');
                    preview.src = e.target.result;
                    preview.classList.remove('hidden');
                }
                reader.readAsDataURL(selectedFile);
            }
        }

        function resetForm() {
            document.getElementById('productForm').reset();
            selectedFile = null;
            document.getElementById('imagePlaceholder').classList.remove('hidden');
            document.getElementById('imagePreview').classList.add('hidden');
            document.getElementById('imagePreview').src = "";
        }

        // 1. Leer productos desde la tabla de Supabase
        async function fetchProducts() {
            setStatus("Sincronizando...", "neon", "fa-circle-notch animate-spin");
            try {
                const { data, error } = await supabaseClient
                    .from(TABLE_NAME)
                    .select('*')
                    .order('id', { ascending: false });

                if (error) throw error;

                memoryProducts = data || [];
                setStatus("Supabase Activo", "neon", "fa-check");
                renderInventory();

            } catch (error) {
                console.error("Error leyendo Supabase:", error);
                setStatus("Error BD", "red-500", "fa-triangle-exclamation");
                showToast(`Error: ${error.message}`, true);
            }
        }

        // 2. Subir foto al Bucket de Supabase Storage
        async function uploadImageToSupabase(file) {
            const cleanName = file.name.replace(/[^a-zA-Z0-9._-]/g, '_');
            const fileName = `prod_${Date.now()}_${cleanName}`;

            const { error: uploadError } = await supabaseClient.storage
                .from(BUCKET_NAME)
                .upload(fileName, file, {
                    cacheControl: '3600',
                    upsert: false
                });

            if (uploadError) {
                throw new Error(`Error subiendo imagen: ${uploadError.message}`);
            }

            const { data: urlData } = supabaseClient.storage
                .from(BUCKET_NAME)
                .getPublicUrl(fileName);

            return urlData.publicUrl;
        }

        // 3. Guardar producto al enviar formulario
        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!selectedFile) return showToast("Falta seleccionar una imagen", true);

            const btn = document.getElementById('submitBtn');
            btn.classList.add('disabled-btn');
            
            try {
                btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> 1/2 Subiendo foto a Supabase...`;
                const imgUrl = await uploadImageToSupabase(selectedFile);

                btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> 2/2 Guardando en Base de Datos...`;
                const newProduct = {
                    name: document.getElementById('productName').value.trim(),
                    category: document.getElementById('productCategory').value,
                    price: parseFloat(document.getElementById('productPrice').value),
                    img: imgUrl
                };

                const { error: insertError } = await supabaseClient
                    .from(TABLE_NAME)
                    .insert([newProduct]);

                if (insertError) throw insertError;

                showToast("¡Producto publicado con éxito!");
                resetForm();
                await fetchProducts();

            } catch (error) {
                console.error("Fallo al publicar:", error);
                showToast(`Error: ${error.message}`, true);
            } finally {
                btn.classList.remove('disabled-btn');
                btn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up text-base"></i> Publicar Producto`;
            }
        });

        // 4. Modal y función para eliminar producto
        window.askDeleteProduct = function(id) {
            productToDeleteId = id;
            const modal = document.getElementById('delete-modal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        };

        window.closeDeleteModal = function() {
            productToDeleteId = null;
            const modal = document.getElementById('delete-modal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        };

        document.getElementById('confirm-delete-btn').addEventListener('click', async () => {
            if (!productToDeleteId) return;
            const idToRemove = productToDeleteId;
            closeDeleteModal();

            try {
                setStatus("Eliminando...", "neon", "fa-circle-notch animate-spin");
                const { error } = await supabaseClient
                    .from(TABLE_NAME)
                    .delete()
                    .eq('id', idToRemove);

                if (error) throw error;

                showToast("Producto eliminado correctamente");
                await fetchProducts();
            } catch (error) {
                console.error("Fallo al borrar:", error);
                showToast(`Error eliminando: ${error.message}`, true);
                setStatus("Error", "red-500", "fa-xmark");
            }
        });

        // 5. Renderizar lista de inventario
        function renderInventory() {
            const list = document.getElementById('inventoryList');
            document.getElementById('countDisplay').textContent = memoryProducts.length;

            if (memoryProducts.length === 0) {
                list.innerHTML = `<div class="text-center py-16 border border-dashed border-white/10 rounded-2xl bg-blackBg"><i class="fa-solid fa-ghost text-4xl text-white/20 mb-3 animate-pulse"></i><p class="text-grayText text-xs font-semibold">Base de datos vacía. Sube tu primer accesorio.</p></div>`;
                return;
            }

            list.innerHTML = memoryProducts.map(p => `
                <div class="flex items-center justify-between bg-blackBg p-3.5 rounded-2xl border border-white/5 hover:border-neon/40 transition-all group shadow-sm">
                    <div class="flex items-center gap-3.5">
                        <img src="${p.img}" class="w-14 h-14 object-cover rounded-xl border border-white/10 bg-blackCard" onerror="this.src='https://placehold.co/100x100/0f1115/39ff14?text=Sin+Foto'"/>
                        <div>
                            <h4 class="text-xs sm:text-sm font-bold text-whiteText truncate max-w-[160px] sm:max-w-[240px] group-hover:text-neon transition-colors">${p.name}</h4>
                            <div class="flex gap-2.5 items-center mt-1">
                                <span class="text-neon text-xs font-black">$${parseFloat(p.price).toFixed(2)}</span>
                                <span class="text-[9px] bg-blackCard border border-white/10 px-2 py-0.5 rounded-md text-grayText uppercase font-semibold">${p.category}</span>
                            </div>
                        </div>
                    </div>
                    <button onclick="askDeleteProduct('${p.id}')" class="w-9 h-9 rounded-xl flex items-center justify-center text-grayText hover:text-red-400 hover:bg-red-500/10 transition-all active:scale-90" title="Eliminar"><i class="fa-solid fa-trash-can"></i></button>
                </div>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', fetchProducts);
    </script>
</body>
</html>
