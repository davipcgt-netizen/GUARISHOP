<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GuariShop Studio | Panel de Administración</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        blackBg: '#050505', 
                        blackCard: '#0f1115',
                        neon: '#39ff14', 
                        neonHover: '#32e612',
                        whiteText: '#f8f8f8', 
                        grayText: '#a0a0a0'
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'], display: ['Poppins', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Poppins:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { background-color: #050505; color: #f8f8f8; overflow-x: hidden; position: relative; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #111111; border-radius: 4px; border: 1px solid #39ff14; }
        
        .neon-text { color: #39ff14; text-shadow: 0 0 12px rgba(57, 255, 20, 0.7); }
        .neon-bg-glow { box-shadow: 0 0 25px rgba(57, 255, 20, 0.35); }
        .disabled-btn { opacity: 0.5; cursor: not-allowed; pointer-events: none; }

        /* Partículas flotantes de fondo optimizadas por GPU */
        @keyframes ambient-float {
            0% { transform: translate3d(0, 0, 0) rotate(0deg); opacity: 0.1; }
            50% { transform: translate3d(var(--dx), var(--dy), 0) rotate(180deg); opacity: 0.3; }
            100% { transform: translate3d(0, 0, 0) rotate(360deg); opacity: 0.1; }
        }
        .bg-particle {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            color: #39ff14;
            animation: ambient-float var(--duration) ease-in-out infinite;
            will-change: transform, opacity;
        }

        /* Orbes de luz ambiental */
        @keyframes pulse-glow {
            0%, 100% { opacity: 0.1; filter: blur(50px); }
            50% { opacity: 0.25; filter: blur(70px); }
        }
        .ambient-orb {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            background: rgba(57, 255, 20, 0.12);
            pointer-events: none;
            z-index: 0;
            animation: pulse-glow 5s ease-in-out infinite;
        }

        .glass-header { background: rgba(15, 17, 21, 0.9); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
    </style>
</head>
<body class="font-sans min-h-screen flex flex-col relative z-10">

    <div id="ambient-particles">
        <i class="fa-solid fa-bolt bg-particle text-xs" style="top: 15%; left: 10%; --duration: 7s; --dx: 40px; --dy: -50px;"></i>
        <i class="fa-solid fa-cloud-arrow-up bg-particle text-sm" style="top: 35%; left: 88%; --duration: 9s; --dx: -45px; --dy: 60px;"></i>
        <i class="fa-solid fa-boxes-stacked bg-particle text-xs" style="top: 75%; left: 8%; --duration: 8s; --dx: 50px; --dy: -40px;"></i>
        <i class="fa-solid fa-shield-halved bg-particle text-sm" style="top: 85%; left: 85%; --duration: 6.5s; --dx: -35px; --dy: -30px;"></i>
    </div>

    <!-- Header -->
    <header class="glass-header border-b border-white/10 px-6 py-4 flex flex-col sm:flex-row justify-between items-center gap-4 sticky top-0 z-40 shadow-xl">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-blackBg border border-neon rounded-xl flex items-center justify-center neon-bg-glow">
                <i class="fa-solid fa-bolt text-neon text-lg animate-pulse"></i>
            </div>
            <h1 class="font-display font-bold text-xl uppercase tracking-wider text-whiteText">GuariShop <span class="text-neon">Studio</span></h1>
        </div>
        <div class="flex gap-4 items-center">
            <span id="conn-status" class="flex items-center gap-2 text-xs font-bold text-grayText border border-white/10 px-3.5 py-2 rounded-xl bg-blackBg shadow-inner">
                <i class="fa-solid fa-circle-notch animate-spin text-neon"></i> Conectando...
            </span>
            <a href="index.html" target="_blank" class="bg-neon/10 text-neon border border-neon/50 hover:bg-neon hover:text-blackBg transition-all font-bold px-4 py-2 rounded-xl text-xs uppercase flex items-center gap-2 neon-bg-glow active:scale-95">
                <i class="fa-solid fa-store"></i> Ver Tienda
            </a>
        </div>
    </header>

    <main class="max-w-6xl mx-auto w-full p-4 sm:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8 items-start relative z-10 my-6">
        <div class="ambient-orb top-10 left-1/4"></div>
        
        <!-- Formulario de Subida -->
        <section class="lg:col-span-5 bg-blackCard border border-neon/30 rounded-3xl p-6 sm:p-8 shadow-2xl relative overflow-hidden">
            <div class="absolute -top-10 -right-10 w-36 h-36 bg-neon/15 rounded-full blur-[50px] pointer-events-none"></div>
            
            <h2 class="font-display text-xl font-bold uppercase mb-6 flex items-center gap-3 text-whiteText border-b border-white/10 pb-4">
                <div class="w-8 h-8 rounded-lg bg-neon/10 border border-neon/40 flex items-center justify-center text-neon">
                    <i class="fa-solid fa-cloud-arrow-up"></i>
                </div>
                Publicar Accesorio
            </h2>
            
            <form id="productForm" class="space-y-5 relative z-10">
                <!-- Zona Foto -->
                <div>
                    <label class="block text-[11px] font-bold text-grayText mb-1.5 uppercase tracking-wider">Foto del Producto (Obligatorio)</label>
                    <div class="relative border-2 border-dashed border-white/20 hover:border-neon bg-blackBg rounded-2xl p-5 text-center transition-all cursor-pointer group shadow-inner" onclick="document.getElementById('productImage').click()">
                        <input type="file" id="productImage" accept="image/*" class="hidden" onchange="previewImage(this)" required>
                        <div id="imagePlaceholder" class="flex flex-col items-center justify-center space-y-2.5 pointer-events-none py-4">
                            <div class="w-12 h-12 rounded-full bg-white/5 border border-white/10 flex items-center justify-center group-hover:border-neon group-hover:bg-neon/10 transition-all">
                                <i class="fa-solid fa-image text-xl text-white/40 group-hover:text-neon transition-colors"></i>
                            </div>
                            <span class="text-xs font-semibold text-grayText group-hover:text-whiteText transition-colors">Toca para subir imagen</span>
                        </div>
                        <img id="imagePreview" src="" class="hidden w-full h-40 object-cover rounded-xl border border-neon/40 shadow-md">
                    </div>
                </div>

                <!-- Datos -->
                <div>
                    <label class="block text-[11px] font-bold text-grayText mb-1.5 uppercase tracking-wider">Nombre</label>
                    <input type="text" id="productName" placeholder="Ej: Audífonos Gamer RGB" class="w-full bg-blackBg border border-white/10 rounded-xl px-4 py-3.5 text-sm text-whiteText outline-none focus:border-neon focus:ring-1 focus:ring-neon transition-all" required>
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-[11px] font-bold text-grayText mb-1.5 uppercase tracking-wider">Categoría</label>
                        <select id="productCategory" class="w-full bg-blackBg border border-white/10 rounded-xl px-4 py-3.5 text-sm text-whiteText outline-none focus:border-neon focus:ring-1 focus:ring-neon transition-all cursor-pointer appearance-none">
                            <option value="adifonos">Audífonos</option>
                            <option value="cargadores">Cargadores</option>
                            <option value="forros">Forros</option>
                            <option value="iluminacion">Iluminación</option>
                            <option value="multiples">Múltiples</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-bold text-grayText mb-1.5 uppercase tracking-wider">Precio ($)</label>
                        <input type="number" step="0.5" id="productPrice" placeholder="0.00" class="w-full bg-blackBg border border-white/10 rounded-xl px-4 py-3.5 text-sm text-neon font-bold outline-none focus:border-neon focus:ring-1 focus:ring-neon transition-all" required>
                    </div>
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-neon text-blackBg font-display font-black py-4 rounded-xl uppercase tracking-wider hover:bg-neonHover transition-all neon-bg-glow active:scale-95 flex items-center justify-center gap-2.5 mt-6 shadow-lg shadow-neon/25 cursor-pointer">
                    <i class="fa-solid fa-cloud-arrow-up text-base"></i> Publicar Producto
                </button>
            </form>
        </section>

        <!-- Inventario en GitHub -->
        <section class="lg:col-span-7 bg-blackCard border border-white/10 rounded-3xl p-6 sm:p-8 shadow-2xl flex flex-col h-[620px] relative overflow-hidden">
            <div class="absolute -bottom-10 -right-10 w-36 h-36 bg-neon/10 rounded-full blur-[50px] pointer-events-none"></div>
            
            <div class="flex justify-between items-center mb-6 pb-4 border-b border-white/10 relative z-10">
                <h2 class="font-display text-xl font-bold uppercase flex items-center gap-3 text-whiteText">
                    <div class="w-8 h-8 rounded-lg bg-neon/10 border border-neon/40 flex items-center justify-center text-neon">
                        <i class="fa-solid fa-boxes-stacked"></i>
                    </div>
                    Nube GitHub
                </h2>
                <span class="bg-blackBg border border-neon/40 px-3.5 py-1.5 rounded-xl text-xs font-bold text-neon shadow-sm"><span id="countDisplay">0</span> publicadas</span>
            </div>
            
            <div id="inventoryList" class="flex-grow overflow-y-auto space-y-3.5 pr-2 relative z-10">
                <!-- Se inyecta via JS -->
            </div>
        </section>
    </main>

    <!-- Toasts (Notificaciones) -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 bg-blackCard border border-neon text-white px-6 py-3.5 rounded-2xl z-50 transform translate-y-20 opacity-0 transition-all duration-300 shadow-2xl flex items-center gap-3 neon-bg-glow">
        <i id="toastIcon" class="fa-solid fa-bolt text-neon text-lg"></i><span id="toastMsg" class="text-xs font-bold tracking-wide"></span>
    </div>

    <!-- Script Principal (Lógica API) -->
    <script>
        // =========================================================
        // ⚡ TUS LLAVES (VERIFICADAS Y CORRECTAS - INTACTAS)
        // =========================================================
        const IMGBB_API_KEY = "ef775dc438f7d06a6d81dbc15835901f";
        const GITHUB_TOKEN = "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";
        
        const GITHUB_USER = "davipcgt-netizen"; 
        const GITHUB_REPO = "TrendyShop"; 
        const FILE_PATH = "guarishop_bd.json"; 
        
        let selectedFile = null;
        let memoryProducts = [];
        let currentSha = null;

        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            document.getElementById('toastIcon').className = `fa-solid ${isError ? 'fa-triangle-exclamation text-red-500 text-lg' : 'fa-bolt text-neon text-lg'}`;
            t.className = `fixed bottom-6 left-1/2 -translate-x-1/2 bg-blackCard border ${isError ? 'border-red-500 shadow-[0_0_20px_rgba(239,68,68,0.3)]' : 'border-neon neon-bg-glow'} text-white px-6 py-3.5 rounded-2xl z-50 transform transition-all duration-300 shadow-2xl flex items-center gap-3 translate-y-0 opacity-100`;
            setTimeout(() => { t.classList.add('translate-y-20', 'opacity-0'); }, 4000);
        }

        function setStatus(msg, color, icon) {
            const el = document.getElementById('conn-status');
            el.innerHTML = `<i class="fa-solid ${icon} text-${color}"></i> ${msg}`;
            el.className = `flex items-center gap-2 text-xs font-bold text-white border border-${color}/30 bg-${color}/10 px-3.5 py-2 rounded-xl shadow-sm`;
        }

        function previewImage(input) {
            if (input.files && input.files[0]) {
                selectedFile = input.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('imagePlaceholder').classList.add('hidden');
                    const preview = document.getElementById('imagePreview');
                    preview.src = e.target.result;
                    preview.classList.remove('hidden');
                }
                reader.readAsDataURL(selectedFile);
            }
        }

        function resetForm() {
            document.getElementById('productForm').reset();
            selectedFile = null;
            document.getElementById('imagePlaceholder').classList.remove('hidden');
            document.getElementById('imagePreview').classList.add('hidden');
            document.getElementById('imagePreview').src = "";
        }

        async function fetchProducts() {
            setStatus("Leyendo nube...", "neon", "fa-circle-notch animate-spin");
            const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FILE_PATH}`;
            
            try {
                const response = await fetch(url, {
                    headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Accept': 'application/vnd.github.v3+json' }
                });

                if (response.status === 404) {
                    memoryProducts = [];
                    currentSha = null;
                    setStatus("GitHub Listo", "neon", "fa-check");
                    renderInventory();
                    return;
                }

                if (!response.ok) throw new Error(`GitHub rechazó la conexión. Código: ${response.status}`);

                const result = await response.json();
                currentSha = result.sha; 
                
                const cleanContent = result.content.replace(/\s/g, ''); 
                const decodedText = decodeURIComponent(escape(window.atob(cleanContent)));
                memoryProducts = JSON.parse(decodedText);
                
                setStatus("GitHub Conectado", "neon", "fa-check");
                renderInventory();

            } catch (error) {
                console.error("Error leyendo GitHub:", error);
                setStatus("Fallo de conexión", "red-500", "fa-triangle-exclamation");
                showToast(`Error: ${error.message}`, true);
            }
        }

        async function saveToGitHub() {
            const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FILE_PATH}`;
            
            const jsonString = JSON.stringify(memoryProducts, null, 2);
            const contentBase64 = window.btoa(unescape(encodeURIComponent(jsonString)));

            const body = {
                message: `Actualización de productos GuariShop`,
                content: contentBase64
            };
            if (currentSha) body.sha = currentSha;

            const response = await fetch(url, {
                method: 'PUT',
                headers: {
                    'Authorization': `token ${GITHUB_TOKEN}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(body)
            });

            if (!response.ok) {
                const errData = await response.json();
                throw new Error(`Fallo guardando en GitHub: ${errData.message}`);
            }
            const result = await response.json();
            currentSha = result.content.sha;
        }

        async function uploadImageToImgBB(file) {
            const formData = new FormData();
            formData.append('image', file);
            
            const response = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, {
                method: 'POST',
                body: formData
            });
            
            const result = await response.json();
            if (result.success) {
                return result.data.url; 
            } else {
                throw new Error(`ImgBB Error: ${result.error.message}`);
            }
        }

        document.getElementById('productForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            if (!selectedFile) return showToast("Falta seleccionar una imagen", true);

            const btn = document.getElementById('submitBtn');
            btn.classList.add('disabled-btn');
            
            try {
                btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> 1/2 Subiendo foto...`;
                const imgUrl = await uploadImageToImgBB(selectedFile);

                const newProduct = {
                    id: Date.now().toString(),
                    name: document.getElementById('productName').value,
                    category: document.getElementById('productCategory').value,
                    price: parseFloat(document.getElementById('productPrice').value),
                    img: imgUrl, 
                    timestamp: new Date().toISOString()
                };

                memoryProducts.unshift(newProduct);

                btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> 2/2 Guardando producto...`;
                await saveToGitHub();

                showToast("¡Producto publicado con éxito en la nube!");
                resetForm();
                renderInventory();

            } catch (error) {
                console.error("Fallo al publicar:", error);
                showToast(`Error: ${error.message}`, true);
            } finally {
                btn.classList.remove('disabled-btn');
                btn.innerHTML = `<i class="fa-solid fa-cloud-arrow-up"></i> Publicar Producto`;
            }
        });

        window.deleteProduct = async function(id) {
            if(!confirm("¿Seguro que deseas eliminar este producto permanentemente?")) return;
            
            try {
                memoryProducts = memoryProducts.filter(p => p.id !== id);
                setStatus("Borrando...", "neon", "fa-circle-notch animate-spin");
                await saveToGitHub();
                
                showToast("Producto eliminado correctamente");
                setStatus("GitHub Conectado", "neon", "fa-check");
                renderInventory();
            } catch (error) {
                console.error("Fallo al borrar:", error);
                showToast(`Error eliminando: ${error.message}`, true);
                setStatus("Error", "red-500", "fa-xmark");
            }
        }

        function renderInventory() {
            const list = document.getElementById('inventoryList');
            document.getElementById('countDisplay').textContent = memoryProducts.length;

            if (memoryProducts.length === 0) {
                list.innerHTML = `<div class="text-center py-16 border border-dashed border-white/10 rounded-2xl bg-blackBg"><i class="fa-solid fa-ghost text-4xl text-white/20 mb-3 animate-pulse"></i><p class="text-grayText text-xs font-semibold">Base de datos vacía. Sube tu primer accesorio.</p></div>`;
                return;
            }

            list.innerHTML = memoryProducts.map(p => `
                <div class="flex items-center justify-between bg-blackBg p-3.5 rounded-2xl border border-white/5 hover:border-neon/40 transition-all group shadow-sm">
                    <div class="flex items-center gap-3.5">
                        <img src="${p.img}" class="w-14 h-14 object-cover rounded-xl border border-white/10 group-hover:border-neon/40 transition-colors" onerror="this.src='https://placehold.co/100x100?text=Error'"/>
                        <div>
                            <h4 class="text-xs font-bold text-whiteText truncate max-w-[160px] sm:max-w-[220px] group-hover:text-neon transition-colors">${p.name}</h4>
                            <div class="flex gap-2.5 items-center mt-1.5">
                                <span class="text-neon text-xs font-bold">$${p.price.toFixed(2)}</span>
                                <span class="text-[9px] bg-blackCard border border-white/10 px-2 py-0.5 rounded-md text-grayText uppercase font-semibold">${p.category}</span>
                            </div>
                        </div>
                    </div>
                    <button onclick="deleteProduct('${p.id}')" class="w-9 h-9 rounded-xl flex items-center justify-center text-grayText hover:text-red-500 hover:bg-red-500/10 transition-all active:scale-90" title="Eliminar"><i class="fa-solid fa-trash-can"></i></button>
                </div>
            `).join('');
        }

        document.addEventListener('DOMContentLoaded', fetchProducts);
    </script>
</body>
</html>
